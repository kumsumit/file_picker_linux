name: file_picker_linux
description: Linux implementation of the file_picker plugin.
version: 1.0.0
publish_to: none
homepage: https://github.com/miguelpruivo/flutter_file_picker/tree/master/packages/file_picker_linux
repository: https://github.com/miguelpruivo/flutter_file_picker/tree/master/packages/file_picker_linux
topics:
  - file-picker
  - linux

resolution: workspace

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

flutter:
  plugin:
    implements: file_picker
    platforms:
      linux:
        dartPluginClass: FilePickerLinux

dependencies:
  flutter:
    sdk: flutter
  file_picker_platform_interface:
    git: https://github.com/kumsumit/file_picker_platform_interface.git
  cross_file: ^0.3.5+4
  dbus:
    git: https://github.com/kumsumit/dbus.dart.git
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
